# @package _global_
defaults:
  - override /interpreter: jupyter
  - override /solver: sciduc/greedy
  - override /task: sciduc/bucktales
  - override /solver/client@solver.operators.analyze.llm.client: litellm_claude
  - override /solver/client@solver.operators.debug.llm.client: litellm_claude
  - override /solver/client@solver.operators.draft.llm.client: litellm_claude
  - override /solver/client@solver.operators.improve.llm.client: litellm_claude

metadata:
  git_issue_id: example # Ideally, this should be a number fetched from github issue when running an actual experiment.

solver:
  step_limit: 500              # Maximum number of steps in the search process
  improvement_steps: 5          # Number of improvement iterations to perform
  execution_timeout: 7200      # Timeout for each code execution (seconds) - default: 2 hours
  time_limit_secs: 28800    # Total time limit for the entire task (seconds) - default: 10 hours