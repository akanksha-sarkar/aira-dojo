# @package _global_
defaults:
  - override /interpreter: jupyter
  - override /solver: sciduc/greedy
  - override /task: sciduc/bucktales
  - override /solver/operators/sciduc@solver.operators:
    - aira_operators/debug
    - aira_operators/warm_draft
    - aira_operators/improve
    - aide_operators/analyze
  - override /solver/client@solver.operators.analyze.llm.client: litellm_gpt5-4
  - override /solver/client@solver.operators.debug.llm.client: litellm_gpt5-4
  - override /solver/client@solver.operators.draft.llm.client: litellm_gpt5-4
  - override /solver/client@solver.operators.improve.llm.client: litellm_gpt5-4

metadata:
  git_issue_id: example # Ideally, this should be a number fetched from github issue when running an actual experiment.

solver:
  step_limit: 5             # Maximum number of steps in the search process
  improvement_steps: 5          # Number of improvement iterations to perform
  execution_timeout: 7200      # Timeout for each code execution (seconds) - default: 2 hours
  time_limit_secs: 36000    # Total time limit for the entire task (seconds) - default: 10 hours


  # litellm_gpt5-2